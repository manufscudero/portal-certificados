version: '3.8'

services:
  # Servidor web PHP 
    build: .
    container_name: portal_certificados_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    restart: always
    depends_on:
      - db

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: portal_certificados_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: certificados_db 
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Administrador de BD phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portal_certificados_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: